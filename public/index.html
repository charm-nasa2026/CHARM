<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>C.H.A.R.M. · Crew Health</title>
<link rel="icon" href="assets/logo.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#05080F">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CHARM">
<script src="js/push-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/examples/jsm/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: mission-control display. Collapsible nav rail on the left, header with time control, scrubber, scrolling view; overlays live inside the app so they scale with the device frame. Single dark look by choice. */
:root{
  color-scheme: dark;
  --bg:#040914; --bg2:#081127; --panel:rgba(13,23,44,.80); --panel2:rgba(19,32,60,.88); --solid:#0E1830;
  --line:rgba(125,170,235,.17); --line2:rgba(125,170,235,.32);
  --ink:#EAF1FB; --mute:#9DB0CB; --faint:#7487A4;
  --cyan:#38BDF8; --cyan2:#8FDcff; --cyanbg:rgba(56,189,248,.13);
  --ok:#3DDC97; --warn:#FF8A1F;--att:#F5D90A; --crit:#FF4D4F; --nd:#8F9AAE;
  --f-disp:'Exo 2','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
html,body{height:100%;margin:0}
#app{width:100%;height:100vh;height:100dvh}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- stage + device frames ---------- */
#stage{height:100%;display:flex;flex-direction:column;gap:8px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;
  background:radial-gradient(1200px 600px at 70% -10%,#0D1B3A 0%,transparent 60%),var(--bg)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:20px;padding:2px;background:rgba(10,18,36,.8)}
.seg button{border:none;background:none;height:32px;padding:0 12px;border-radius:16px;color:var(--mute);font-size:13px;font-weight:600;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--cyan);color:#04101F}
#stagearea{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
#devwrap{position:relative}
#devinner{transform-origin:0 0;position:absolute;left:0;top:0}
#bezel{position:relative;box-sizing:border-box}
#devwrap.none{width:100%;height:100%}
#devwrap.none #devinner{position:static;transform:none;width:100%;height:100%}
#devwrap.none #bezel{width:100%;height:100%}
#devwrap.none #app{width:100%;height:100%;border-radius:18px;border:1px solid var(--line)}
#devwrap.laptop #bezel{padding:26px 22px 22px;border-radius:24px;background:linear-gradient(#141821,#0B0E14);border:1px solid #2A303C;box-shadow:0 30px 80px rgba(0,0,0,.6)}
#devwrap.laptop #bezel::before{content:"";position:absolute;top:10px;left:50%;width:7px;height:7px;margin-left:-3px;border-radius:50%;background:#26303F}
#base{display:none}
#devwrap.laptop #base{display:block;position:relative;height:26px;margin:0 -9%;border-radius:0 0 22px 22px;background:linear-gradient(#3A414E,#1B2029 60%,#11151C);border:1px solid #2F3643;border-top:none}
#devwrap.laptop #base::before{content:"";position:absolute;left:50%;top:0;width:180px;margin-left:-90px;height:9px;border-radius:0 0 10px 10px;background:#141820}
#devwrap.tablet #bezel,#devwrap.portrait #bezel{padding:26px;border-radius:44px;background:linear-gradient(#171B24,#0B0E14);border:1px solid #2C3240;box-shadow:0 30px 80px rgba(0,0,0,.6)}
#devwrap.laptop #app,#devwrap.tablet #app,#devwrap.portrait #app{border-radius:8px}
#devwrap.tablet #app,#devwrap.portrait #app{border-radius:18px}

/* ---------- app ---------- */
#app{container:app / inline-size;position:relative;overflow:hidden;display:flex;flex-direction:column;background:radial-gradient(900px 500px at 85% 0%,rgba(56,120,248,.13),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(140,80,240,.10),transparent 60%),var(--bg2);box-sizing:border-box}
#stars{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.7}
#app.night{filter:sepia(.9) hue-rotate(-38deg) saturate(2.6) brightness(.6)}
#app.reduce *,#app.reduce *::before{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){#app *{animation:none!important;transition:none!important}}
.shell{position:relative;display:flex;flex:1;min-height:0}

/* nav */
.tip{position:absolute;z-index:70;transform:translate(-50%,-100%);max-width:260px;padding:8px 12px;border-radius:10px;background:#0B1427;border:1px solid var(--line2);font-size:13px;line-height:1.4;color:var(--ink);pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.tip b{display:block;font-size:13.5px}
.nav{position:relative;z-index:30;flex:none;width:244px;display:flex;flex-direction:column;gap:2px;padding:14px 10px;box-sizing:border-box;border-right:1px solid var(--line);background:rgba(6,12,26,.78);backdrop-filter:blur(8px);transition:width .18s ease,transform .2s ease;overflow-y:auto;overflow-x:hidden}
.brand{flex:none;display:flex;align-items:center;gap:10px;padding:0 6px 0 0;min-height:48px;border:none;background:none;color:inherit;text-align:left;border-radius:14px}
.brand:hover .wm{color:var(--cyan2)}
.brand img{width:42px;height:42px;flex:none;border-radius:50%;box-shadow:0 0 18px rgba(56,189,248,.35)}
.brand .wm{font-family:var(--f-disp);font-weight:800;font-size:23px;letter-spacing:2px;color:var(--cyan);text-shadow:0 0 14px rgba(56,189,248,.55);line-height:1}
.brand .wm small{display:block;font-family:var(--f-body);font-weight:500;font-size:9.5px;letter-spacing:.6px;color:var(--mute);text-shadow:none;margin-top:4px;white-space:nowrap}
.navbtn{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 12px;border:none;border-radius:12px;background:none;color:var(--mute);font-size:15px;font-weight:500;text-align:left;white-space:nowrap;position:relative}
.navbtn svg{flex:none;width:22px;height:22px}
.navbtn:hover{background:rgba(125,170,235,.08);color:var(--ink)}
.navbtn[aria-current="page"]{background:var(--cyanbg);color:var(--ink);box-shadow:inset 3px 0 0 var(--cyan)}
.navlabel{overflow:hidden;text-overflow:ellipsis}
.navsec{font-size:11px;font-weight:700;letter-spacing:1.4px;color:var(--faint);padding:14px 12px 6px;white-space:nowrap}
.navcrew{min-height:44px;gap:10px}
.navcrew .av{width:28px;height:28px}
.navcrew .dot{margin-left:auto}
.navfoot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:12px}
.whoami{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:rgba(14,24,44,.6);text-align:left;color:var(--ink);min-height:52px;width:100%}
.whoami .av{width:32px;height:32px}
.whoami span{display:flex;flex-direction:column;line-height:1.25;min-width:0;white-space:nowrap}
.whoami small{color:var(--mute);font-size:12px}
.protonote{font-size:11.5px;line-height:1.45;color:var(--faint);padding:4px 10px}
.shell.collapsed .nav{width:76px}
.shell.collapsed .navlabel,.shell.collapsed .navsec,.shell.collapsed .protonote,.shell.collapsed .whoami>span:not(.av),.shell.collapsed .navcrew .dot{display:none}
.shell.collapsed .navbtn{justify-content:center;padding:0}
.shell.collapsed .whoami{justify-content:center;padding:8px 0}
.navscrim{display:none}

/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;position:relative;z-index:1}
.top{flex:none;position:relative;z-index:40;display:flex;align-items:center;gap:12px;height:68px;padding:0 16px 0 14px;border-bottom:1px solid var(--line);background:rgba(6,12,26,.82);backdrop-filter:blur(8px)}
.iconbtn.menubtn{display:none}
.iconbtn{flex:none;display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:24px;border:1px solid var(--line2);background:rgba(14,24,44,.75);color:var(--ink)}
.iconbtn svg{width:22px;height:22px}
.crumb{min-width:0;display:flex;flex-direction:column;line-height:1.2}
.crumb b{font-family:var(--f-disp);font-weight:700;font-size:19px;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb small{color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topsp{flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line2);background:rgba(14,24,44,.75);color:var(--ink);font-size:14px;font-weight:500;white-space:nowrap}
.pill .dotl{width:9px;height:9px;border-radius:50%;flex:none}
.timepill{font-family:var(--f-mono);font-size:13.5px}
.timepill .live{font-family:var(--f-body);font-weight:700;font-size:12px;letter-spacing:1.2px;color:var(--ok)}
.timepill .hist{font-family:var(--f-body);font-weight:700;font-size:12px;letter-spacing:1.2px;color:var(--cyan2)}
.timepill.history{border-color:var(--cyan);background:var(--cyanbg)}
.livedot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(61,220,151,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,151,.55)}70%{box-shadow:0 0 0 8px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
.embtn{flex:none;display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 20px;border-radius:26px;border:none;background:#C9262B;color:#fff;font-family:var(--f-disp);font-weight:800;font-size:15px;letter-spacing:1.2px;box-shadow:0 0 22px rgba(255,77,79,.35)}
.embtn svg{width:16px;height:16px}

/* scrubber */
.scrub{flex:none;display:flex;align-items:center;gap:12px;padding:8px 20px 8px;border-bottom:1px solid var(--line);background:rgba(5,10,22,.35)}
.scrub .lbl{font-size:11px;font-weight:700;letter-spacing:1.3px;color:var(--faint);white-space:nowrap}
.track{position:relative;flex:1;height:40px;touch-action:none;cursor:pointer}
.track .rail{position:absolute;left:0;right:0;top:15px;height:10px;border-radius:5px;background:rgba(125,170,235,.10);border:1px solid var(--line)}
.track .dayseg{position:absolute;top:0;height:40px;border-left:1px solid var(--line2)}
.track .dayseg span{position:absolute;left:6px;top:-1px;font-size:10.5px;color:var(--faint);font-weight:600;white-space:nowrap}
.track .tick{position:absolute;top:13px;width:3px;height:14px;border-radius:2px;margin-left:-1px}
.track .rng{position:absolute;top:13px;height:14px;border-radius:4px;background:rgba(56,189,248,.28);border:1px solid var(--cyan)}
.track .handle{position:absolute;top:6px;width:4px;height:28px;margin-left:-2px;border-radius:2px;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.track .handle::after{content:"";position:absolute;left:-7px;top:-6px;width:18px;height:18px;border-radius:50%;background:var(--cyan);border:3px solid #061022;box-sizing:border-box}
.track .nowmark{position:absolute;top:8px;height:24px;width:2px;background:var(--ok);margin-left:-1px}
.livebtn{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--ok);background:rgba(61,220,151,.08);color:var(--ok);font-weight:700;font-size:12px;letter-spacing:1.2px;white-space:nowrap}
.histbanner{flex:none;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 20px;background:linear-gradient(90deg,rgba(56,189,248,.18),rgba(56,189,248,.05));border-bottom:1px solid rgba(56,189,248,.35);font-size:14px}
.histbanner b{font-family:var(--f-mono);font-weight:500}
.histbanner .sp{flex:1}
.histbanner button{height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--cyan);background:none;color:var(--cyan2);font-weight:600}

/* view */
.view{flex:1;min-height:0;overflow:auto;padding:20px 24px 110px;box-sizing:border-box;position:relative}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.ph h1{margin:0;font-family:var(--f-disp);font-weight:700;font-size:26px;letter-spacing:.3px;text-wrap:balance}
.ph p{margin:4px 0 0;color:var(--mute);font-size:14px}
.ph .sp{flex:1}
.sum{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line2);background:rgba(14,24,44,.7);font-size:13px;font-weight:600;white-space:nowrap}
.card{position:relative;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(6px)}
.sec{font-size:11.5px;font-weight:700;letter-spacing:1.5px;color:var(--faint);margin:0 0 10px}
.muted{color:var(--mute)}
.faint{color:var(--faint)}
a{color:var(--cyan2)}

/* status */
.lvw{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-disp);font-weight:800;letter-spacing:1.3px;font-size:14px;white-space:nowrap}
.lvw svg{width:14px;height:14px;flex:none}
.c-3{color:var(--crit)} .c-2{color:var(--warn)} .c-0{color:var(--ok)} .c-n{color:#AEB8CA}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.d-3{background:var(--crit);box-shadow:0 0 8px var(--crit)} .d-2{background:var(--warn)} .d-0{background:var(--ok)} .d-n{background:none;border:2px solid var(--nd);box-sizing:border-box}
.av{flex:none;display:inline-block;width:40px;height:40px;border-radius:50%;overflow:hidden;background:#1A2746;border:2px solid var(--line2);box-sizing:border-box}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.r-3{border-color:var(--crit)} .av.r-2{border-color:var(--warn)} .av.r-0{border-color:var(--ok)} .av.r-n{border-color:var(--nd);border-style:dashed}

/* env strip */
.envstrip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.env{display:flex;align-items:center;gap:12px;padding:12px 16px;text-align:left;border:1px solid var(--line);color:var(--ink);min-height:64px}
.env .k{font-size:12px;color:var(--mute);font-weight:600}
.env .v{font-family:var(--f-mono);font-size:17px}
.env.e-2{border-color:rgba(255,138,31,.55);background:rgba(60,40,8,.45)}
.env.e-3{border-color:rgba(255,77,79,.6);background:rgba(70,14,18,.5)}
.envbanner{display:flex;gap:12px;align-items:center;padding:12px 16px;margin-bottom:16px;border-radius:14px;border:1px solid rgba(255,138,31,.5);background:rgba(60,40,8,.5);font-size:14.5px}

/* crew cards */
.crewgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.ccard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 12px 14px;text-align:center;width:100%;color:var(--ink);border:1px solid var(--line);transition:transform .15s ease,border-color .15s}
.ccard:hover{transform:translateY(-2px)}
.cmain{display:flex;flex-direction:column;align-items:center;gap:5px;width:100%;border:none;background:none;color:inherit;padding:0;cursor:pointer}
.whyc{display:flex;align-items:center;gap:4px;width:100%;min-height:58px}
.wview{flex:1;min-width:0;overflow:hidden;border-radius:12px}
.wtrack{display:flex;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.witem{flex:0 0 100%;box-sizing:border-box;min-height:54px;display:flex;align-items:center;justify-content:center;gap:7px;padding:6px 10px;border:none;border-radius:12px;background:rgba(125,170,235,.08);color:var(--ink);font-size:14px;line-height:1.3;cursor:pointer}
.witem svg{width:12px;height:12px;flex:none}
.witem.w-3{background:rgba(255,77,79,.13)} .witem.w-2{background:rgba(255,138,31,.11)} .witem.w-n{background:rgba(143,154,174,.12)}
.wbtn{flex:none;width:34px;height:30px;border-radius:15px;border:1px solid var(--line);background:rgba(10,18,36,.8);color:var(--ink);font-size:18px;line-height:1;padding:0 0 2px}
.wdots{display:flex;gap:6px;justify-content:center;align-items:center;min-height:6px}
.wctl{display:flex;align-items:center;justify-content:center;gap:10px;min-height:30px}
.wdots i{width:6px;height:6px;border-radius:3px;background:rgba(125,170,235,.25)}
.wdots i.on{background:var(--ink);width:14px}
.pager{display:flex;align-items:stretch;gap:10px}
.pgview{flex:1;min-width:0;overflow:hidden;touch-action:pan-y;padding:4px 2px 6px}
.pgtrack{display:flex;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.pgtrack>.crewgrid{flex:0 0 100%;box-sizing:border-box;padding:0 2px;align-content:start}
.pgbtn{flex:none;align-self:center;width:46px;height:46px;border-radius:50%;border:1px solid var(--line2);background:rgba(10,18,36,.85);color:var(--ink);font-size:26px;line-height:1;padding:0 0 3px}
.pgbtn:disabled{opacity:.25;cursor:default}
.dots{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px}
.dots button{width:12px;height:12px;border-radius:6px;border:none;padding:0;background:rgba(125,170,235,.3);position:relative}
.dots button::after{content:"";position:absolute;inset:-14px -6px}
.dots button[aria-current="true"]{width:30px;background:var(--cyan)}
.dots button.dw-3{box-shadow:0 0 0 2px var(--crit)} .dots button.dw-2{box-shadow:0 0 0 2px var(--warn)}
.dots .pglbl{font-size:12.5px;color:var(--mute);margin-left:8px}
.ccard.k-3{border-color:rgba(255,77,79,.65);box-shadow:0 0 0 1px rgba(255,77,79,.25),0 0 34px rgba(255,77,79,.18)}
.ccard.k-2{border-color:rgba(255,138,31,.55);box-shadow:0 0 26px rgba(255,138,31,.10)}
.ccard.k-0{border-color:rgba(61,220,151,.35)}
.ccard.k-n{border-style:dashed;border-color:rgba(143,154,174,.6)}
.ring{position:relative;width:110px;height:110px;border-radius:50%;padding:6px;box-sizing:border-box;margin-bottom:4px}
.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 50%;display:block;background:#0A1224}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;border:5px solid var(--rc,var(--ok));box-shadow:0 0 18px var(--rc,var(--ok)),inset 0 0 12px var(--rc,var(--ok))}
.ring.g-3{--rc:var(--crit)} .ring.g-2{--rc:var(--warn)} .ring.g-0{--rc:var(--ok)}
.ring.g-n::before{border-style:dashed;border-color:var(--nd);box-shadow:none}
.ring.g-3::before{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 34px var(--crit),inset 0 0 16px var(--crit)}}
.ccard .nm{font-family:var(--f-disp);font-weight:700;font-size:21px}
.ccard .rl{font-size:13.5px;color:var(--mute)}
.tag{display:inline-block;padding:1px 7px;border:1px solid var(--line2);border-radius:6px;font-size:11.5px;font-weight:600;color:#C9D6EA;letter-spacing:.4px}
.ccard .why{font-size:15px;line-height:1.35;min-height:20px}
.ccard .upd{font-size:12.5px;color:var(--faint)}
.ccard .bigv{font-family:var(--f-mono);font-size:28px;line-height:1.1}
.ccard .bigv small{font-family:var(--f-body);font-size:13px;color:var(--mute);margin-left:4px}
.ccard .wir{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--cyan2)}
.lensbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:18px;padding:12px;border-radius:18px;border:1px solid var(--line);background:rgba(6,12,26,.6)}
.lensbar .lb{font-size:11px;font-weight:700;letter-spacing:1.4px;color:var(--faint);padding:0 6px}
.lchip{height:44px;padding:0 15px;border-radius:22px;border:1px solid var(--line2);background:rgba(14,24,44,.75);font-size:14px;font-weight:500;color:var(--ink);white-space:nowrap}

.bub.ch{align-self:flex-start;background:#152340;border:1px solid var(--line);border-bottom-left-radius:4px}
.bub .s{display:block;font-size:12px;color:var(--faint);margin-top:6px}
.chfoot{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.chfoot input{flex:1;min-width:0;height:50px;border-radius:25px;border:1px solid var(--line2);background:var(--solid);padding:0 16px}
.mic{width:56px;height:56px;border-radius:50%;border:none;background:var(--cyan);display:flex;align-items:center;justify-content:center;flex:none}
.mic svg{width:24px;height:24px}
.modal{left:50%;top:50%;transform:translate(-50%,-50%);width:760px;max-width:calc(100% - 32px);max-height:calc(100% - 40px);overflow:auto;padding:24px}
.drop{border:2px dashed var(--line2);border-radius:16px;padding:26px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
table.map{width:100%;border-collapse:collapse;font-size:14px}
table.map th{text-align:left;font-size:11px;letter-spacing:1px;color:var(--faint);padding:8px 10px;border-bottom:1px solid var(--line2)}
table.map td{padding:10px;border-bottom:1px solid var(--line)}
table.map code{font-family:var(--f-mono);font-size:13px;color:#C8D5E8}
.warnbox{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:rgba(255,138,31,.10);border:1px solid rgba(255,138,31,.45);font-size:14px;margin-top:12px}
.progpill{position:absolute;left:20px;bottom:20px;z-index:46;width:270px;padding:12px 16px;border-radius:24px;background:#0D1730;border:1px solid var(--line2);font-size:13.5px;font-weight:600}
.toasts{position:absolute;right:20px;top:80px;z-index:60;display:flex;flex-direction:column;gap:10px;width:340px;max-width:calc(100% - 40px)}
.toast{padding:14px 16px;border-radius:14px;background:#0F1C38;border:1px solid var(--line2);box-shadow:0 14px 40px rgba(0,0,0,.5);font-size:14px;display:flex;gap:10px;align-items:flex-start}
.toast div{flex:1}
.toast b{display:block;margin-bottom:2px}
.empop{right:20px;top:76px;width:440px;max-width:calc(100% - 40px);padding:20px}
.emgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.empop{width:520px}
.ralert{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px solid rgba(255,77,79,.55);background:rgba(255,77,79,.10);margin-bottom:10px;flex-wrap:wrap}
.ralert .av{width:48px;height:48px}
.ralert .rt{flex:1;min-width:160px}
.ralert .rt b{font-size:16px}
.ralert .rt div{font-size:13.5px;color:#E5C9CB}
.chset{padding:14px 16px;overflow:auto;flex:1}
.emgrid button,.hzgrid button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:14px;border:1px solid var(--line2);background:rgba(14,24,44,.75);color:var(--ink);font-size:13px;font-weight:600;min-height:88px;justify-content:center}
.emgrid button[aria-pressed="true"],.hzgrid button[aria-pressed="true"]{border-color:var(--crit);background:rgba(255,77,79,.15)}
.emgrid .av{width:44px;height:44px}
.hzgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}

/* emergency */
.emer{position:absolute;inset:0;background:#070B16;display:flex;flex-direction:column;border:4px solid var(--crit);box-sizing:border-box;z-index:55}
.emtop{flex:none;display:flex;align-items:center;gap:16px;min-height:84px;padding:10px 24px;background:#B3191E;color:#fff;flex-wrap:wrap}
.emtop h2{margin:0;font-family:var(--f-disp);font-size:26px;font-weight:800;letter-spacing:.4px;flex:1;min-width:240px;text-wrap:balance}
.emtop .tm{text-align:right;font-family:var(--f-mono);font-size:30px;line-height:1}
.emtop .tm small{display:block;font-family:var(--f-body);font-size:12px;opacity:.9;margin-top:4px}
.emtabs{flex:none;display:flex;gap:6px;padding:8px 24px 0;border-bottom:1px solid rgba(255,77,79,.35)}
.emtabs button{height:42px;padding:0 18px;border-radius:12px 12px 0 0;border:1px solid transparent;background:none;color:var(--mute);font-weight:700}
.emtabs button[aria-pressed="true"]{border-color:var(--crit);border-bottom-color:#070B16;background:#120C18;color:var(--ink)}
.embody{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:28px;padding:22px 24px}
.emstep{display:flex;flex-direction:column;gap:18px;justify-content:center}.emstep.cmo{gap:12px;justify-content:flex-start}.emstep.cmo h3{font-size:32px}.emstep.cmo p{font-size:16px}.emstep.cmo .yn button{width:auto;min-width:200px;height:72px;font-size:22px;letter-spacing:1px;padding:0 28px}.btn.tick{white-space:normal;height:auto;min-height:48px;padding-top:10px;padding-bottom:10px;line-height:1.35;text-align:left;justify-content:flex-start}
.emstep .sn{display:flex;align-items:center;gap:14px;font-weight:700;color:var(--mute);font-size:17px}
.emstep .sn i{display:inline-block;width:46px;height:8px;border-radius:4px;background:#26334F}
.emstep .sn i.on{background:var(--ink)}
.emstep h3{margin:0;font-family:var(--f-disp);font-size:44px;line-height:1.12;font-weight:800;text-wrap:balance}
.emstep p{margin:0;font-size:18px;color:#C8D5E8;line-height:1.5;max-width:720px}
.yn{display:flex;gap:20px;flex-wrap:wrap}
.yn button{width:240px;max-width:100%;height:104px;border-radius:20px;font-family:var(--f-disp);font-size:36px;font-weight:800;letter-spacing:2px;color:#fff}
.yn .y{border:3px solid var(--ok);background:rgba(61,220,151,.08)}
.yn .n{border:none;background:#B3191E}
.yn .d{border:3px solid var(--cyan);background:rgba(56,189,248,.1);font-size:26px;width:auto;padding:0 32px}
.vit{display:flex;flex-direction:column;gap:10px}
.vbox{padding:12px 16px;border-radius:14px;background:#0C1426;border:1px solid var(--line)}
.vbox.b-3{border-color:rgba(255,77,79,.55)} .vbox.b-2{border-color:rgba(255,138,31,.45)}
.vbox .vr{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:#C8D5E8}
.vbox .vv{font-family:var(--f-mono);font-size:38px;line-height:1.1}
.vbox .vv small{font-family:var(--f-body);font-size:14px;color:var(--mute);margin-left:6px}
.v3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.v3 .vv{font-size:26px}
canvas.ecg{display:block;width:100%;height:64px}
.emlog{font-size:13px;color:#C8D5E8;line-height:1.6;max-height:150px;overflow:auto}
.emlog span{font-family:var(--f-mono);color:var(--mute);margin-right:8px}
.embot{flex:none;display:flex;gap:14px;padding:14px 24px 18px;flex-wrap:wrap;align-items:center}
.embot .btn{height:72px;flex:1;min-width:150px;border-radius:16px;font-size:16px}
.emnote{flex:none;padding:0 24px;color:var(--mute);font-size:14px}

/* ---------- round 3 additions ---------- */
/* scrollbars that match the console look */
#app *{scrollbar-width:thin;scrollbar-color:rgba(56,189,248,.42) transparent}
#app ::-webkit-scrollbar{width:10px;height:10px}
#app ::-webkit-scrollbar-track{background:transparent}
#app ::-webkit-scrollbar-thumb{border-radius:6px;border:3px solid transparent;background:linear-gradient(rgba(56,189,248,.55),rgba(143,120,250,.45)) padding-box}
#app ::-webkit-scrollbar-thumb:hover{background:linear-gradient(var(--cyan),#9F8CFB) padding-box}
#app ::-webkit-scrollbar-corner{background:transparent}

/* app bar */
.brand img{width:40px;height:40px}
.abdiv{flex:none;width:1px;height:34px;background:var(--line2);margin:0 4px}
.daypill{gap:10px;padding:0 16px 0 14px}
.daypill .dayn{font-family:var(--f-disp);font-weight:700;font-size:12px;letter-spacing:1.3px;color:var(--mute)}
.daypill .dayn b{font-size:17px;color:var(--ink);letter-spacing:.5px;margin-left:3px}
.daypill .tm{font-family:var(--f-mono);font-size:13.5px;color:var(--ink)}
.gearbtn{width:46px;height:46px}

/* nav: collapse button at the top */
.coltog{min-height:44px;color:var(--faint);margin-bottom:6px;border-bottom:1px solid var(--line);border-radius:12px 12px 0 0}
.coltog:hover{color:var(--cyan2)}
.navgrp .navlabel{flex:none}
.navgrp .cnt{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute)}
.navgrp .chev{width:16px;height:16px;transition:transform .18s}
.navgrp[aria-expanded="true"] .chev{transform:rotate(180deg)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:10px;font-size:11.5px;font-weight:800;color:#fff}
.badge.b-3{background:#C9262B} .badge.b-2{background:#A86F05} .badge.b-n{background:#4A5468}
.navsub{max-height:300px;overflow-y:auto;flex:none;display:flex;flex-direction:column;gap:2px;padding-left:8px;margin-left:12px;border-left:1px solid var(--line)}
.shell.collapsed .navgrp .cnt{position:absolute;top:4px;right:6px;margin:0}
.shell.collapsed .navgrp .chev{display:none}
.shell.collapsed .navgrp .badge:not(:first-child){display:none}
.shell.collapsed .navsub{padding-left:0;margin-left:0;border-left:none}

/* crew overview: sort, rotation control, tasks ticker */
.sortseg{display:flex;align-items:center;gap:10px}
.sortseg .lb{font-size:11px;font-weight:700;letter-spacing:1.3px;color:var(--faint)}
.sortseg .seg button{height:36px}
.pgplay{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;margin-left:10px;border-radius:17px;border:1px solid var(--line2);background:rgba(10,18,36,.8);color:var(--mute);font-size:12.5px;font-weight:600}
.pgplay svg{width:12px;height:12px}
.pgplay[aria-pressed="false"]{color:var(--warn);border-color:rgba(255,138,31,.5)}
.ticker{margin-top:14px;padding:8px 14px 8px 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.tkhd{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.tkhd .sec{margin:0}
.tkview{flex:1;min-width:260px;height:56px;overflow:hidden;border-left:1px solid var(--line);padding-left:16px}
.tkrow{border-bottom:none!important}
.tktrack{transition:transform .55s cubic-bezier(.2,.7,.2,1)}
.tkrow{display:flex;align-items:center;gap:12px;height:56px;box-sizing:border-box;border-bottom:1px solid var(--line);padding:0 2px}
.tkrow .av{width:36px;height:36px}
.tkrow .tkt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.tkrow .tkt b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tkrow .tkt span{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tkrow .due{flex:none;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:8px;background:rgba(125,170,235,.12);color:#C8D5E8}
.tkrow .due.now{background:rgba(255,138,31,.16);color:var(--warn)}
.tkrow .btn{height:38px}

/* all crew metrics matrix */
.mxwrap{overflow:auto;padding:0}
table.mx{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;min-width:980px}
table.mx th{position:sticky;top:0;z-index:2;background:#0B1530;padding:10px 6px;border-bottom:1px solid var(--line2);font-size:11px;letter-spacing:.8px;font-weight:700;color:var(--faint);text-align:center;white-space:nowrap}
table.mx th button{border:none;background:none;color:inherit;font:inherit;letter-spacing:inherit;padding:4px 6px;border-radius:8px;display:inline-flex;flex-direction:column;align-items:center;gap:3px}
table.mx th button:hover,table.mx th button[aria-pressed="true"]{color:var(--cyan2);background:var(--cyanbg)}
table.mx th .hc{display:flex;gap:3px;justify-content:center;min-height:18px}
table.mx th .hc .badge{min-width:18px;height:18px;font-size:10.5px}
table.mx td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
table.mx td.who{position:sticky;left:0;z-index:1;background:#0A1328;text-align:left;padding-left:10px;width:150px;max-width:160px}
table.mx th.who{left:0;z-index:3;text-align:left;padding-left:14px}
.mxwho{display:flex;align-items:center;gap:10px;border:none;background:none;color:var(--ink);padding:0;text-align:left}
.mxwho .av{width:36px;height:36px}
.mxwho b{display:block;font-size:14.5px}
.mxwho small{display:block;color:var(--mute);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:104px}
.mxwho>span{min-width:0}
.mxc{width:100%;min-width:60px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:10px;border:1px solid transparent;background:rgba(125,170,235,.05);color:var(--ink);padding:4px 2px}
.mxc:hover{border-color:var(--line2)}
.mxc b{font-family:var(--f-mono);font-weight:500;font-size:15px;line-height:1.1}
.mxc b small{font-family:var(--f-body);font-size:10.5px;color:var(--mute);margin-left:2px}
.mxc .lvw{font-size:9.5px;letter-spacing:.8px;gap:4px}
.mxc .lvw svg{width:9px;height:9px}
.mxc.x-3{background:rgba(255,77,79,.16);border-color:rgba(255,77,79,.5)}
.mxc.x-2{background:rgba(255,138,31,.12);border-color:rgba(255,138,31,.42)}
.mxc.x-n{background:rgba(143,154,174,.08);border:1px dashed rgba(143,154,174,.45)}
.mxc.x-0 .lvw{opacity:.75}
table.mx td.mxo .lvw{font-size:11.5px}
table.mx tr:hover td{background-color:rgba(125,170,235,.04)}

/* previous / next astronaut */
.pnav{display:flex;align-items:center;gap:8px}
.pnbtn{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 14px 0 10px;border-radius:24px;border:1px solid var(--line2);background:rgba(14,24,44,.75);color:var(--ink);font-weight:600;font-size:14px;white-space:nowrap}
.pnbtn.nx{padding:0 10px 0 14px}
.pnbtn .av{width:30px;height:30px}
.pnbtn .ar{font-size:22px;line-height:1;margin-top:-2px;color:var(--cyan2)}
.pncount{font-size:12.5px;color:var(--mute);min-width:44px;text-align:center}

/* Charmy 3D */
.c3d{position:absolute;inset:0}
.c3d canvas{display:block}
.charmy-fab{width:112px;height:124px;right:10px;bottom:6px}
.charmy-fab.has3d .cha,.charmy-fab.has3d .spark{display:none}
.charmy-fab.has3d::before{left:22px;right:22px;bottom:4px}
.fabstop{position:absolute;z-index:46;right:24px;bottom:132px;display:none;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;border:1px solid rgba(255,77,79,.6);background:#2A0E14;color:#fff;font-size:13px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.fabstop svg{width:12px;height:12px}
#app.talking:not(.chatopen) .fabstop{display:inline-flex}
.chpop{right:16px;bottom:14px;width:450px;height:640px;max-height:calc(100% - 96px)}
.chbar{display:flex;align-items:center;height:36px;padding-left:14px;background:rgba(4,9,20,.75);border-bottom:1px solid var(--line);flex:none}
.chbar .ttl{flex:1;min-width:0;font-size:12.5px;font-weight:700;letter-spacing:1.2px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chbar .ttl i{display:inline-block;width:7px;height:7px;border-radius:50%;margin:0 6px 1px 2px;vertical-align:middle}
.wbtns{display:flex;align-self:stretch}
.wb{width:42px;height:36px;display:flex;align-items:center;justify-content:center;border:none;background:none;color:var(--mute);padding:0}
.wb svg{width:15px;height:15px}
.wb:hover{background:rgba(125,170,235,.14);color:var(--ink)}
.wb.close:hover{background:#C9262B;color:#fff}
.wb[aria-pressed="true"]{color:var(--cyan2);background:var(--cyanbg)}
.wb.stop{display:none;color:#FF8A8C}
#app.talking .wb.stop{display:flex}
.chstage{display:flex;align-items:center;gap:12px;padding:6px 16px 8px 8px;border-bottom:1px solid var(--line);background:radial-gradient(160px 120px at 70px 60%,rgba(56,189,248,.16),transparent 70%);flex:none}
.chava{position:relative;width:118px;height:128px;flex:none}
.chava .cha{width:100%;height:100%;object-fit:contain}
.chinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.chinfo b{font-family:var(--f-disp);font-size:20px}
.chinfo .ctx{font-size:13px;color:var(--mute);line-height:1.4}
.stoptalk{display:none;align-self:flex-start;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:20px;border:1px solid rgba(255,77,79,.6);background:rgba(255,77,79,.14);color:#fff;font-weight:700;font-size:13.5px}
.stoptalk svg{width:12px;height:12px}
#app.talking .stoptalk{display:inline-flex}
.talkwave{display:none;gap:3px;align-items:flex-end;height:14px}
.talkwave i{width:3px;border-radius:2px;background:var(--cyan2);animation:tw .8s ease-in-out infinite}
.talkwave i:nth-child(2){animation-delay:.15s}.talkwave i:nth-child(3){animation-delay:.3s}.talkwave i:nth-child(4){animation-delay:.45s}
@keyframes tw{0%,100%{height:3px}50%{height:14px}}
#app.talking .talkwave{display:inline-flex}
.bub .cur{display:inline-block;width:7px;height:15px;margin-left:2px;vertical-align:-2px;background:var(--cyan2);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.chfoot .mic.stopm{background:#C9262B}
.chset .grpl{font-size:11px;font-weight:700;letter-spacing:1.3px;color:var(--faint);margin:14px 0 8px}
.chset .grpl:first-child{margin-top:0}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{height:38px;padding:0 13px;border-radius:19px;border:1px solid var(--line2);background:rgba(14,24,44,.75);color:var(--ink);font-size:13px;font-weight:500}
.opts button[aria-pressed="true"]{background:var(--cyan);border-color:var(--cyan);color:#04101F;font-weight:700}
.opts button:disabled{opacity:.4;cursor:not-allowed}
.saybox textarea{width:100%;box-sizing:border-box;min-height:64px;border-radius:12px;border:1px solid var(--line2);background:var(--solid);padding:10px 12px;resize:vertical;font-size:14px}
.sayout{min-height:44px;margin-top:8px;padding:10px 12px;border-radius:12px;background:#050C1C;border:1px solid var(--line);font-family:var(--f-mono);font-size:13.5px;color:var(--cyan2);white-space:pre-wrap}
.sayout:empty::before{content:"Charmy's written reply appears here.";color:var(--faint)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;min-height:44px}
.chk input{width:20px;height:20px;accent-color:var(--cyan)}


/* ---------- live app additions ---------- */
.laybtn{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 14px;border-radius:23px;border:1px solid var(--line2);background:rgba(14,24,44,.75);color:var(--ink);font-size:13.5px;font-weight:600;white-space:nowrap}
.laybtn svg{width:20px;height:20px;color:var(--cyan2)}
.laybtn .lb2{color:var(--mute);font-weight:500}
.pers{display:inline-block;font:700 10.5px/1 var(--f-body);letter-spacing:1px;padding:4px 7px;border-radius:6px;background:rgba(56,189,248,.16);color:var(--cyan2)}
.syncpill{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line2);font-size:12.5px;color:var(--mute);white-space:nowrap}
.syncpill i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.syncpill.warn{color:var(--warn);border-color:rgba(255,138,31,.5)}.syncpill.warn i{background:var(--warn)}
.syncpill.err{color:#FF8A8C;border-color:rgba(255,77,79,.5)}.syncpill.err i{background:var(--crit)}
.crumb{flex:1 1 120px}
@media (max-width:1600px){.laybtn .lb2{display:none}.syncpill{font-size:0;gap:0;width:34px;padding:0;justify-content:center}.syncpill i{width:10px;height:10px}}
.demotag{display:inline-block;padding:1px 6px;border-radius:5px;border:1px solid rgba(167,139,250,.6);color:#C4B5FD;font-size:10.5px;font-weight:800;letter-spacing:.8px;vertical-align:1px}
.empty{padding:28px;text-align:center}
.empty h2{font-family:var(--f-disp);font-size:24px;margin:0 0 8px}
.empty p{color:var(--mute);max-width:620px;margin:0 auto 16px;line-height:1.5}

<script>
/* Startup intro decision. Runs before the page draws so the app never flashes first.
   Skipped when: this device used CHARM in the last 8 hours, an emergency was open last time, reduced motion is on, or ?nointro. Force with ?intro=1. */
(function(){var H8=8*3600e3,now=Date.now(),last=0,em=false,q=location.search,show;
  try{last=+localStorage.getItem('charm-last-active')||0;em=localStorage.getItem('charm-emergency-open')==='1';}catch(e){}
  var rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  show=/[?&]intro=1\b/.test(q)||!(/[?&](nointro|push=1)\b/.test(q)||now-last<H8||em||rm);
  try{localStorage.setItem('charm-last-active',String(now));}catch(e){}
  window.__charmWho=show;
  if(show)document.documentElement.classList.add('intro-on');})();
</script>

<div id="intro" aria-label="C.H.A.R.M. intro. Press Escape or tap to skip.">
  <img class="ibg" src="" data-src="assets/intro-backdrop.webp" alt="">
  <video id="introv" data-src="assets/intro.mp4" playsinline preload="auto"></video>

<script>
(function(){var R=document.documentElement;if(!R.classList.contains('intro-on'))return;
  var box=document.getElementById('intro'),v=document.getElementById('introv'),bg=box.querySelector('.ibg'),snd=document.getElementById('introsnd'),done=false;
  bg.src=bg.dataset.src;v.poster=bg.dataset.src;v.src=v.dataset.src;v.muted=false;
  function sndLabel(){snd.textContent=v.muted?'Sound on':'Sound off';}
  function close(now){if(done)return;done=true;try{v.pause();}catch(e){}
    box.classList.add(now?'gone-now':'gone');
    setTimeout(function(){R.classList.remove('intro-on');if(box.parentNode)box.parentNode.removeChild(box);},now?150:850);}
  window.CHARM_INTRO={close:close,active:function(){return !done;}};
  function blocked(){setTimeout(function(){close(false);},1500);} // autoplay blocked even muted: show the still briefly
  // Sound on by default. Browsers refuse autoplay with sound until the user has interacted with the site, so fall back to muted.
  var p=v.play();if(p&&p.catch)p.catch(function(){if(done)return;v.muted=true;sndLabel();var p2=v.play();if(p2&&p2.catch)p2.catch(blocked);});
  v.addEventListener('ended',function(){setTimeout(function(){close(false);},350);});
  v.addEventListener('error',function(){close(true);});
  setTimeout(function(){close(false);},12000); // never block the app
  document.getElementById('introskip').addEventListener('click',function(e){e.stopPropagation();close(false);});
  snd.addEventListener('click',function(e){e.stopPropagation();v.muted=!v.muted;sndLabel();});
  box.addEventListener('click',function(){close(false);});
  document.addEventListener('keydown',function(e){if(!done&&(e.key==='Escape'||e.key==='Enter'||e.key===' ')){e.preventDefault();close(false);}},true);
})();
</script>

  if(ms<0)ms=0; var m=Math.round(ms/MIN);

  var g=function(r,n){var v=ix[n]!=null?r[ix[n]]:'';return v==null?'':v;},num=function(r,n){var v=g(r,n);return v===''?null:+v;},yes=function(r,n){return /^(1|yes|true)$/i.test(g(r,n));};
  var out=[],t0=null,first=null;
  lines.slice(1).forEach(function(l){if(!l.trim())return;var r=csvLine(l),t=Date.parse(g(r,'time_gmt'));if(isNaN(t))return;if(t0==null)t0=t;var o=t-t0,ctx=/^(rest|ex|sleep)$/.test(g(r,'context'))?g(r,'context'):null;
    var add=function(x){x.o=o;out.push(x);};
    [['heart_rate','hr'],['spo2','spo2'],['resp_rate','rr'],['temp_c','temp'],['glucose_mgdl','glu'],['sleep_hours','sleep'],['radiation_dose_pct','dose'],['mood_0_10','mood'],['exercise_pct','ex'],['fluid_intake_l','fluid'],['weight_kg','wt']].forEach(function(m){var v=num(r,m[0]);if(v==null||isNaN(v))return;var x={k:m[1],v:v};if(m[1]==='hr'&&yes(r,'irregular_rhythm'))x.irr=true;if(ctx&&['hr','spo2','rr'].indexOf(m[1])>=0)x.ctx=ctx;add(x);});
    var s1=num(r,'bp_systolic'),d1=num(r,'bp_diastolic');if(s1!=null&&d1!=null){var b={k:'bp',v:s1,v2:d1};if(ctx)b.ctx=ctx;add(b);}
    if(g(r,'ecg_irregular')!==''||g(r,'ecg_seconds')!==''){var e={irr:yes(r,'ecg_irregular')};if(yes(r,'ecg_no_p_waves'))e.noP=true;if(num(r,'ecg_seconds')!=null)e.sec=num(r,'ecg_seconds');if(yes(r,'ecg_unstable'))e.unstable=true;add({k:'ecg',x:e});}
    var nt=g(r,'note');if(nt){add({note:nt});if(first==null)first=o;}
  });
  return {rows:out,first:first,span:out.length?out[out.length-1].o:0,who:(lines[1]?csvLine(lines[1])[ix.astronaut]:'')};}

/* ===================== DEMO SCENARIOS (medic team): Pulmonary infection · Dehydration · SANS · Bone health =====================
   Source of truth: the medic team's PDFs and CSV files in data/scenarios/, built into js/scenarios.js by tools/build_scenarios.py.
   Every text shown comes from those CSV files. "Run live" writes each stage's measurements into the astronaut's file (marked DEMO)

   Simulated demonstration – not a flight-certified medical protocol. */
function scnList(){return window.CHARM_SCENARIOS||[];}
function scnGet(id){var l=scnList();for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i];return l[0]||null;}
function scnCur(){return scnGet(S.scnSid||(SR.sid)||'pulm');}
function scnColor(code){return code==='CRITICAL'?'var(--crit)':code==='ALERT'?'var(--warn)':'var(--ok)';}
function scnHas(st,m){return m.some(function(x){return x[0]==='bp'?st.v.sbp!=null:st.v[x[0]]!=null;});}
function scnLast(sc,i){for(var j=i;j>=1;j--)if(scnHas(sc.stages[j-1],sc.m))return sc.stages[j-1];return null;}
function scnBase(sc,k){for(var j=0;j<sc.stages.length;j++){var v=sc.stages[j].v;if(k==='bp'?v.sbp!=null:v[k]!=null)return sc.stages[j];}return null;}
function scnFmt(st,k,d){if(!st)return '—';var v=st.v;if(k==='bp')return v.sbp==null?'—':v.sbp+'/'+v.dbp;if(k==='spo2'&&v.spo2!=null&&v.spo2b!=null&&v.spo2b!==v.spo2)return v.spo2+'–'+v.spo2b;var x=v[k];return x==null?'—':(+x).toFixed(d);}

  if(k==='bp'){if(v.sbp==null)return '';var a=v.sbp-b.sbp,c=v.dbp-b.dbp;return a||c?f(a)+' / '+f(c):'no change';}
  if(v[k]==null||b[k]==null)return '';var x=Math.round((v[k]-b[k])*100)/100;return x?f(x):'no change';}

  }

function scnNotes(sc){var d=(sc.demo||[]).slice(),dis=sc.stages[0]&&sc.stages[0].disclaimer;if(dis)d.push(dis);

/* Emergency Mode for a running medic-team scenario: interactive screens for the Crew Medical Officer, one action per screen,
   read aloud, built from the current stage (actions, checks, tests, equipment, treatment). Rebuilt when the stage changes. */
var EMSC={};
function scnEmFlow(id){
  var ms=MISSION&&MISSION.demoScenario;if(!ms||ms.pid!==id)return null;var sc=scnGet(ms.sid),st=sc&&sc.stages[ms.n-1];if(!st)return null;
  var key=ms.sid+':'+ms.n+':'+(ms.started||0);if(EMSC[key])return EMSC[key];
  var sp=function(t,re){return String(t||'').split(re||/;\s*/).map(function(x){x=x.trim().replace(/\.$/,'');return x.charAt(0).toUpperCase()+x.slice(1);}).filter(Boolean);};
  var cap=function(x){return x.charAt(0).toUpperCase()+x.slice(1)+'.';};
  var f=[{h:'Check if {n} is responsive.',p:'Say their name and gently squeeze their shoulder. Your answer decides the next step.',yn:['c0','cpr']},
    {id:'cpr',h:'Call all crew. Get the medical kit and defibrillator.',p:'Follow the CPR card and keep the airway clear. Then continue with the medical officer screens.',branch:true}];
  sp(st.actions).forEach(function(a,i){f.push({id:'c'+i,h:cap(a),p:'Do this now. Tap Done when it is complete.',cmo:1});});
  var chk=sp(st.checks);if(chk.length)f.push({id:'chk',h:'Measure now.',p:'Tap each check when it is done. CHARM re-checks the alert with every new value.',list:chk,cmo:1});
  if(st.labs&&!/^(none|no blood test)/i.test(st.labs.trim()))f.push({id:'lab',h:'Laboratory tests.',p:'Run what the onboard equipment allows. Tap each one when done or not available.',list:sp(st.labs),cmo:1});
  var eq=sp(st.equip,/[,;]\s*/);if(eq.length)f.push({id:'eq',h:'Bring the equipment.',p:'Tap each item when it is at the patient.',list:eq,cmo:1});
  if(st.treat&&!/^none\.?$/i.test(st.treat.trim()))f.push({id:'tx',h:'Treatment per the approved protocol.',p:st.treat,note:'CHARM does not choose or dose medication. The medical officer follows the mission protocol.',confirm:'Done per protocol · next',cmo:1});
  f.push({id:'end',h:'Reassess and keep monitoring.',p:'Repeat the vital signs every few minutes. Every step is logged and queued for the flight surgeon.'+(st.earth?' Earth is out of contact: continue the onboard protocol.':''),end:true,cmo:1});
  var main=f.filter(function(x){return !x.branch;});
  main.forEach(function(x,i){if(i>0&&!x.end&&!x.yn)x.done=(main[i+1]||{}).id;});
  f[0].yn=[main[1].id,'cpr'];
  f[1].done=main[1]?main[1].id:'end';
  f.forEach(function(x){x.say=x.list?x.h+' '+x.list.join('. ')+'.':x.id==='tx'?x.h+' '+x.p:x.h;});
  f.scn={sid:ms.sid,n:ms.n,of:ms.of,label:ms.label,title:sc.title,earth:!!st.earth,key:key,main:main};
  EMSC[key]=f;return f;}
function emSay(s,id){return (s.say||s.h).replace(/\{n\}/g,HAZ[id]||(CREWBY[id]||{}).name||'');}
/* stage changed while Emergency Mode is open: jump to the new stage's first medical officer screen and say it */
function emSyncStage(id){var fl=emFlow(id),es=emState(id);if(!fl.scn){es.fk=null;return;}
  if(es.step>=fl.length)es.step=0;
  var run=function(k){return k?k.split(':')[2]:null;};
  if(es.fk&&run(es.fk)!==run(fl.scn.key)){es.step=0;es.tick={};es.log=[];es.fk=fl.scn.key;return;}
  if(es.fk&&es.fk!==fl.scn.key){for(var i=0;i<fl.length;i++)if(fl[i].id==='c0'){es.step=i;break;}es.tick={};es.log.push({t:liveNow(),x:'Scenario stage '+fl.scn.n+': '+fl.scn.label});
    var s=fl[es.step];setTimeout(function(){speak('New stage. '+fl.scn.label.replace(' - ',', ')+'. '+emSay(s,id));},60);}
  es.fk=fl.scn.key;}
function scnEmPanel(id){var fl=emFlow(id);if(!fl.scn)return '';var sc=fl.scn,live=SR.sid===sc.sid&&SR.n<sc.of;
  return '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 0 12px"><span class="demotag">DEMO</span><span class="faint" style="font-size:13px">'+esc(sc.title)+' · stage '+sc.n+' of '+sc.of+' · <b style="color:'+scnColor(sc.label.indexOf('CRITICAL')>=0?'CRITICAL':/NORMAL/.test(sc.label)?'NORMAL':'ALERT')+'">'+esc(sc.label)+'</b></span>'+(live?'<button class="btn sm" data-act="srnext" '+(SR.busy?'disabled':'')+' style="margin-left:auto">Next scenario stage ›</button>':'')+'</div>'+
    (sc.earth?'<div style="margin:0 0 12px;padding:8px 12px;border:1px solid var(--crit);border-radius:10px;background:rgba(255,77,79,.12);font-weight:700">Earth communication unavailable – onboard protocol active</div>':'');}

      var v=spec==='b'?/^(1|yes|true)$/i.test(raw):typeof spec[0]==='string'?raw:+raw;if(spec!=='b'&&typeof spec[0]!=='string'&&isNaN(v))return;(exs[ek]||(exs[ek]={}))[f]=v;});

function checkOrange(){if(!S.seenCau)S.seenCau={};var t=liveNow(),cau=CREW.filter(function(p){return personAt(p.id,t).lvl===2;}),ids={};cau.forEach(function(p){ids[p.id]=1;});Object.keys(S.seenCau).forEach(function(k){if(!ids[k])delete S.seenCau[k];});var nw=cau.filter(function(p){return !S.seenCau[p.id];});nw.forEach(function(p){S.seenCau[p.id]=1;});if(nw.length&&S.voice&&!S.emSel)speak('Caution. '+nw.map(function(p){return p.name;}).join(' and ')+(nw.length>1?' need':' needs')+' a check. Open Alerts for the next step.',{queue:true});}

/* emergency helpers */
function openEmer(id,manual){
  S.emSel=id; syncEmergency(); var es=emState(id);

  renderAll(); var fl=emFlow(id); speak((HAZ[id]?'Emergency mode. '+HAZ[id]+'.':'Emergency mode. '+CREWBY[id].name+'.')+' '+emSay(fl[es.step],id));
}
function emAdvance(branch){
  var id=S.emSel,es=emState(id),fl=emFlow(id),cur=fl[es.step],nx=null;
  if(cur.yn){nx=cur.yn[branch];es.log.push({t:liveNow(),x:cur.h.replace('{n}',HAZ[id]||CREWBY[id].name)+' → '+(branch===0?'YES':'NO')});}
  else if(cur.done){nx=cur.done;es.log.push({t:liveNow(),x:cur.h.replace('{n}',HAZ[id]||CREWBY[id].name)+' → done'});}
  if(nx){for(var i=0;i<fl.length;i++)if(fl[i].id===nx)es.step=i;}

/* tests helpers */

  var s=STEPS[RUN.k]&&STEPS[RUN.k][RUN.step];if(!s)return;
  if((s.auto||s.record)&&RUN.prog<100){RUN.prog=0;clearInterval(RUN.timer);RUN.timer=setInterval(function(){RUN.prog=Math.min(100,RUN.prog+(s.record?2:4));var m=$('pm');if(m)m.style.width=RUN.prog+'%';if(RUN.prog>=100){clearInterval(RUN.timer);
    renderView();}},200);}

function saveTest(){
  var k=RUN.k,pid=RUN.pid,t=liveNow(),v=RUN.vals,rs=[],txt='',mk=null;
  if(k==='bp'){rs.push({pid:pid,k:'bp',t:t,v:+v.s,v2:+v.d});if(+v.p)rs.push({pid:pid,k:'hr',t:t,v:+v.p});txt='Blood pressure '+v.s+'/'+v.d+' taken';mk='bp';}
  if(k==='glu'){rs.push({pid:pid,k:'glu',t:t,v:+v.g});txt='Fingerstick glucose '+v.g+' mg/dL';mk='glu';}
  if(k==='ecg'){rs.push({pid:pid,k:'hr',t:t,v:+v.p});rs.push({pid:pid,k:'ecg',t:t,x:{irr:v.rhythm==='irregular',noP:v.pw==='none',sec:60,unstable:v.un==='yes'}});txt='1-min ECG: '+v.rhythm+' rhythm'+(v.rhythm==='irregular'?(v.pw==='none'?', no P waves':', P waves seen'):'')+', '+v.p+' bpm';mk='c_af';}
  if(k==='rt'){var r=RUN.rt,avg=Math.round(r.trials.reduce(function(a,b){return a+b;},0)/r.trials.length);rs.push({pid:pid,k:'rt',t:t,v:avg});txt='Reaction test: '+avg+' ms';}
  for(var i=0;i<rs.length;i++){var er=EN.validateReading(rs[i],t);if(er){S.saveErr='Not saved: '+er+'.';renderView();return;}}
  S.busy=true;S.saveErr=null;renderView();
  api('addReadings',{src:'test',readings:rs,log:{pid:pid,k:mk,text:txt,sub:'Guided test · '+whoName()}}).then(function(res){
    S.busy=false;if(res&&res.rejected&&res.rejected.length&&!res.saved){S.saveErr='Not saved: '+res.rejected[0].reason;renderView();return;}
    RUN=null;toast(res&&res.queued?'Saved on this device':'Saved',TESTS[k].name+(res&&res.queued?' syncs when the connection returns.':' saved and queued for Earth.'));go('astro-'+pid);
  },function(e){S.busy=false;S.saveErr='Not saved: '+e.message;renderView();});
}
function rtTap(){
  var r=RUN.rt;
  if(r.state==='go'){var ms=Math.round(performance.now()-r.t0);r.trials.push(clamp(ms,150,900));r.state=r.trials.length>=5?'done':'next';renderView();return;}

function drawStars(){var c=$('stars'),app=$('app');if(!c)return;var w=app.clientWidth,h=app.clientHeight;c.width=w;c.height=h;var x=c.getContext('2d'),r=rng(42);x.clearRect(0,0,w,h);var n=Math.round(w*h/2400);for(var i=0;i<n;i++){var a=r()*0.75+0.12,big=r()<0.05,s=big?1.5+r()*0.8:r()*0.9+0.25,tint=r();x.fillStyle=tint<0.12?'rgba(255,214,170,'+a.toFixed(2)+')':tint<0.24?'rgba(170,200,255,'+a.toFixed(2)+')':'rgba(235,240,255,'+a.toFixed(2)+')';x.beginPath();x.arc(r()*w,r()*h,s,0,6.283);x.fill();if(big){x.fillStyle='rgba(180,210,255,.08)';x.beginPath();x.arc(r()*w,r()*h,s*4,0,6.283);x.fill();}}}
var ecgPhase=0;
function ecgWave(xx,irr){var period=irr?(70+((Math.floor(xx/80)*37)%41)):90,ph=((xx%period)+period)%period/period;if(ph<0.05)return Math.sin(ph/0.05*Math.PI)*4;if(ph>0.18&&ph<0.21)return -6;if(ph>=0.21&&ph<0.25)return 26;if(ph>=0.25&&ph<0.29)return -10;if(ph>0.45&&ph<0.6)return Math.sin((ph-0.45)/0.15*Math.PI)*6;return irr?Math.sin(xx/7)*1.5:0;}
function drawEcgOn(id,irr,col){var c=$(id);if(!c)return;var x=c.getContext('2d'),w=c.width,h=c.height;x.clearRect(0,0,w,h);x.strokeStyle=col;x.lineWidth=2;x.beginPath();for(var i=0;i<w;i++){var y=h/2+8-ecgWave(i+ecgPhase,irr);if(i)x.lineTo(i,y);else x.moveTo(i,y);}x.stroke();}
